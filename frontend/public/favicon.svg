<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a1f38"/>
      <stop offset="1" stop-color="#120d17"/>
    </linearGradient>
    <linearGradient id="playFill" x1="120" y1="150" x2="400" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5a5a"/>
      <stop offset="0.55" stop-color="#e11d3f"/>
      <stop offset="1" stop-color="#9c0f2e"/>
    </linearGradient>
    <linearGradient id="drip" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#e11d3f"/>
      <stop offset="1" stop-color="#9c0f2e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- background spray speckle -->
  <circle cx="70" cy="86" r="11" fill="#ff5a5a" opacity="0.20"/>
  <circle cx="98" cy="128" r="4" fill="#ff5a5a" opacity="0.28"/>
  <circle cx="446" cy="434" r="15" fill="#a855f7" opacity="0.24"/>
  <circle cx="412" cy="394" r="5" fill="#a855f7" opacity="0.32"/>
  <circle cx="56" cy="424" r="6" fill="#38bdf8" opacity="0.22"/>
  <circle cx="452" cy="90" r="5" fill="#38bdf8" opacity="0.18"/>

  <g transform="rotate(-7 256 256)">
    <!-- thick uneven marker outline -->
    <path d="M126,168
             C120,150 140,132 168,130
             L360,126
             C392,124 412,148 410,178
             L406,332
             C404,362 380,384 350,384
             L156,388
             C126,390 104,368 106,338
             Z"
          fill="#0b0b0d"/>

    <!-- main spray-painted rounded rect -->
    <path d="M138,176
             C134,160 150,146 174,145
             L354,141
             C382,140 398,160 396,184
             L392,326
             C390,352 370,370 344,370
             L164,374
             C140,375 122,357 124,332
             Z"
          fill="url(#playFill)"/>

    <!-- spray sheen streak -->
    <path d="M150,180 C220,150 300,150 360,175" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.18" fill="none"/>

    <!-- play triangle -->
    <path d="M222,196 L222,318 L336,258 Z" fill="#0b0b0d"/>
    <path d="M228,204 L228,310 L326,258 Z" fill="#ffffff"/>

    <!-- drips off bottom edge -->
    <path d="M180,372 C178,392 176,410 182,428 C188,410 186,392 190,374 Z" fill="url(#drip)"/>
    <path d="M300,371 C299,386 296,398 302,412 C308,398 306,386 308,373 Z" fill="url(#drip)"/>
    <path d="M366,362 C365,378 362,392 368,406 C374,392 372,378 374,364 Z" fill="url(#drip)"/>
  </g>
</svg>
