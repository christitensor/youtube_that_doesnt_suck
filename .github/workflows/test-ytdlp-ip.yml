name: Test yt-dlp IP reputation
on:
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Download yt-dlp
        run: |
          curl -sSL -o /tmp/yt-dlp "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux"
          chmod +x /tmp/yt-dlp
      - name: Try real videos from the user's channels (no cookies, default client)
        run: |
          for id in SHglFXPqaMQ qE0BZFo1XJY 5J_bSHdGxlA n-4oTwEo1nw zXQSWYoM6XE MyuQTlyzPtM 6_iZ6cynedQ FV8KigUWjGs XRN6pIkywvk -VxMJabkYgo; do
            echo "=== video: $id ==="
            /tmp/yt-dlp -f "best[ext=mp4]/best" --get-url --no-warnings "https://www.youtube.com/watch?v=$id" 2>&1 | tail -3
            echo
          done
