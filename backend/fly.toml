# Fly.io deploy config. See README.md for setup steps.
app = "ytdns-backend"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  MEDIA_DIR = "/data/media"
  DB_PATH = "/data/app.db"

[mounts]
  source = "ytdns_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
